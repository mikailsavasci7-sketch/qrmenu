<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garson Çağrı Paneli - QR Menü</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold text-amber-500">🔔 Canlı Garson & Masa Paneli</h1>
            <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-sm text-gray-400">Canlı Dinleniyor...</span>
            </div>
        </div>

        <div id="calls-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Çağrılar buraya dinamik gelecek -->
            <div class="text-gray-500 col-span-2 text-center py-10">Yükleniyor...</div>
        </div>
    </div>

    <script>
        async function fetchCalls() {
            try {
                const response = await fetch('/api/calls');
                const calls = await response.json();
                const container = document.getElementById('calls-container');
                
                if (calls.length === 0) {
                    container.innerHTML = '<div class="text-gray-500 col-span-2 text-center py-10 bg-gray-800/50 rounded-2xl border border-gray-800">Aktif çağrı bulunmuyor. Her şey yolunda! ☕</div>';
                    return;
                }

                container.innerHTML = calls.map(call => `
                    <div class="bg-gray-800 border-2 border-amber-500/50 p-6 rounded-2xl shadow-xl flex flex-col justify-between animate-bounce-short">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="bg-amber-500 text-gray-950 font-black px-4 py-1.5 rounded-xl text-xl shadow-lg">Masa ${call.table_no}</span>
                                <span class="text-xs text-gray-400 bg-gray-900 px-2 py-1 rounded">${call.timestamp}</span>
                            </div>
                            <h3 class="text-2xl font-bold text-white mb-2">${call.call_type}</h3>
                        </div>
                        <button onclick="resolveCall(${call.id})" class="mt-4 bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                            ✅ İlgilenildi / Kapat
                        </button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Çağrılar alınamadı:', error);
            }
        }

        async function resolveCall(id) {
            await fetch(`/api/calls/${id}/resolve`, { method: 'POST' });
            fetchCalls();
        }

        // Her 3 saniyede bir çağrıları otomatik kontrol et
        setInterval(fetchCalls, 3000);
        fetchCalls();
    </script>
</body>
</html>
