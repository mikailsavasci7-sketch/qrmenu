<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Yönetim Paneli - QR Menü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 sm:p-8 pb-20">
    <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- Üst Bar -->
        <div class="bg-white rounded-2xl shadow-xl p-6 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-900"><i class="fa-solid fa-gauge-high text-amber-600 mr-2"></i> Kafe Yönetim Paneli</h1>
            <a href="/" target="_blank" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg font-semibold text-gray-600 transition">Menüyü Gör ↗</a>
        </div>

        <!-- Ürün Ekleme Formu -->
        <div class="bg-white rounded-2xl shadow-xl p-6">
            <form action="/admin" method="POST" class="space-y-4">
                <h2 class="text-sm font-bold text-amber-700 uppercase tracking-wider">Yeni Ürün Ekle</h2>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Kategori</label>
                    <select name="category" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <option value="kahve">Sıcak Kahveler</option>
                        <option value="soguk">Soğuk İçecekler</option>
                        <option value="tatli">Tatlılar</option>
                        <option value="kahvalti">Atıştırmalık</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Ürün Adı</label>
                        <input type="text" name="name" required placeholder="Örn: Türk Kahvesi" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Fiyat (₺)</label>
                        <input type="number" step="0.01" name="price" required placeholder="50" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Açıklama</label>
                    <textarea name="desc" rows="2" placeholder="Ürün içeriği..." class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Görsel Linki (URL)</label>
                        <input type="url" name="img" placeholder="https://..." class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Kalori Bilgisi</label>
                        <input type="text" name="cal" placeholder="Örn: 120 kcal" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-sm shadow-lg transition">Ürünü Menüye Ekle</button>
            </form>
        </div>

        <!-- Mevcut Ürünleri Listeleme ve Silme -->
        <div class="bg-white rounded-2xl shadow-xl p-6">
            <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-4">Mevcut Ürünler ve Yönetim</h2>
            <div class="divide-y divide-gray-100 max-h-96 overflow-y-auto">
                {% for product in products %}
                <div class="py-3 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3 min-w-0">
                        <img src="{{ product.img }}" alt="" class="w-12 h-12 rounded-lg object-cover flex-shrink-0">
                        <div class="min-w-0">
                            <h4 class="font-bold text-sm text-gray-900 truncate">{{ product.name }}</h4>
                            <p class="text-xs text-amber-600 font-semibold">{{ product.price }} ₺ &bull; <span class="text-gray-400 capitalize">{{ product.category }}</span></p>
                        </div>
                    </div>
                    <form action="/admin/delete/{{ product.id }}" method="POST" onsubmit="return confirm('Bu ürünü silmek istediğine emin misin?');">
                        <button type="submit" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-bold transition flex items-center gap-1">
                            <i class="fa-solid fa-trash"></i> Sil
                        </button>
                    </form>
                </div>
                {% endfor %}
            </div>
        </div>

    </div>
</body>
</html>
