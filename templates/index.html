<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurme Kafe & Bistro - QR Menü</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-24">

    <header class="bg-gradient-to-r from-amber-600 to-amber-700 p-6 shadow-xl rounded-b-3xl">
        <div class="max-w-md mx-auto flex justify-between items-center mb-4">
            <div>
                <h1 class="text-2xl font-black text-gray-950">Gurme Kafe & Bistro</h1>
                <p id="table-badge" class="text-xs bg-gray-950/40 text-amber-200 font-bold px-3 py-1 rounded-full inline-block mt-1">Masa Yükleniyor...</p>
            </div>
            <div class="flex gap-2">
                <button class="w-10 h-10 bg-gray-950/20 rounded-full flex items-center justify-center text-gray-950 font-bold">⚙️</button>
                <button class="w-10 h-10 bg-gray-950/20 rounded-full flex items-center justify-center text-gray-950 font-bold">🌙</button>
            </div>
        </div>
        <div class="max-w-md mx-auto">
            <input type="text" id="search-input" placeholder="Lezzetli bir şeyler ara..." class="w-full bg-gray-950/20 placeholder-amber-200/70 text-gray-950 font-semibold px-4 py-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-gray-950">
        </div>
    </header>

    <div class="max-w-md mx-auto px-4 mt-6">
        <div id="category-container" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="filterCategory('Tümü')" class="category-btn bg-amber-500 text-gray-950 font-bold px-5 py-2 rounded-xl whitespace-nowrap shadow-lg">Tümü</button>
            <button onclick="filterCategory('Sıcak Kahveler')" class="category-btn bg-gray-900 text-gray-300 font-bold px-5 py-2 rounded-xl whitespace-nowrap border border-gray-800">Sıcak Kahveler</button>
            <button onclick="filterCategory('Soğuk İçecekler')" class="category-btn bg-gray-900 text-gray-300 font-bold px-5 py-2 rounded-xl whitespace-nowrap border border-gray-800">Soğuk İçecekler</button>
            <button onclick="filterCategory('Tatlılar')" class="category-btn bg-gray-900 text-gray-300 font-bold px-5 py-2 rounded-xl whitespace-nowrap border border-gray-800">Tatlılar</button>
            <button onclick="filterCategory('Atıştırmalıklar')" class="category-btn bg-gray-900 text-gray-300 font-bold px-5 py-2 rounded-xl whitespace-nowrap border border-gray-800">Atıştırmalıklar</button>
        </div>
    </div>

    <main class="max-w-md mx-auto px-4 mt-6">
        <h2 class="text-lg font-bold mb-4 text-gray-200">TÜM ÜRÜNLER</h2>
        <div id="products-container" class="space-y-4">
            <div class="text-center text-gray-500 py-10">Ürünler yükleniyor...</div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-gray-900/90 backdrop-blur-md border-t border-gray-800 p-4">
        <div class="max-w-md mx-auto grid grid-cols-2 gap-3">
            <button onclick="sendCall('Garson Çağır')" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-extrabold py-3.5 px-4 rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
                🔔 Garson Çağır
            </button>
            <button onclick="sendCall('Hesap İste')" class="bg-gray-800 hover:bg-gray-700 text-white font-extrabold py-3.5 px-4 rounded-2xl border border-gray-700 transition flex items-center justify-center gap-2">
                💳 Hesap İste
            </button>
        </div>
    </nav>

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-green-600 text-white font-bold px-6 py-3 rounded-2xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50">
        ✅ Çağrınız garsona iletildi!
    </div>

    <script>
        let allProducts = [];
        let currentTable = '01';

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tableParam = urlParams.get('table');
            if (tableParam) {
                currentTable = tableParam;
            }
            document.getElementById('table-badge').innerText = `Masa ${currentTable} • Açık`;
            fetchProducts();
        });

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                allProducts = await res.json();
                displayProducts(allProducts);
            } catch (err) {
                console.error('Ürünler yüklenemedi:', err);
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('products-container');
            if (products.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-10">Bu kategoride henüz ürün bulunmuyor.</div>';
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl flex gap-4 items-center shadow-md">
                    <img src="${p.image || 'https://images.unsplash.com/photo-1541167760496-1628856ab772?w=150'}" alt="${p.name}" class="w-20 h-20 object-cover rounded-xl">
                    <div class="flex-1">
                        <h3 class="font-bold text-lg text-white">${p.name}</h3>
                        <p class="text-sm text-gray-400 line-clamp-1">${p.description || 'Lezzetli bir ikram.'}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-amber-500 font-black text-lg">${p.price} ₺</span>
                            <span class="text-xs text-gray-500">${p.kcal || 150} kcal</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function sendCall(callType) {
            try {
                const res = await fetch('/api/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table_no: currentTable, call_type: callType })
                });
                
                if (res.ok) {
                    showToast(`✅ Masa ${currentTable}: ${callType} gönderildi!`);
                }
            } catch (err) {
                alert('Çağrı gönderilemedi!');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-gray-950');
                btn.classList.add('bg-gray-900', 'text-gray-300', 'border', 'border-gray-800');
            });
            event.target.classList.remove('bg-gray-900', 'text-gray-300', 'border', 'border-gray-800');
            event.target.classList.add('bg-amber-500', 'text-gray-950');

            if (category === 'Tümü') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                displayProducts(filtered);
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        });
    </script>
</body>
</html>
