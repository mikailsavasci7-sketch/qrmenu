<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurme Kafe & Restoran - QR Menü</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbeed6',
                            100: '#fef3c7',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icon Set -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 transition-colors duration-200 pb-24">

    <!-- Header / Banner -->
    <header class="relative bg-gradient-to-r from-amber-600 to-amber-800 text-white shadow-lg">
        <div class="max-w-md mx-auto px-4 py-6 relative z-10">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-amber-700 font-extrabold text-xl shadow-md border-2 border-amber-300">
                        GK
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight">Gurme Kafe & Bistro</h1>
                        <p class="text-xs text-amber-200 flex items-center gap-1">
                            <i class="fa-solid fa-location-dot"></i> Masa 04 &bull; <span class="bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-semibold">Açık</span>
                        </p>
                    </div>
                </div>
                <!-- Admin Panel Link & Dark Mode -->
                <div class="flex items-center gap-2">
                    <a href="/admin" class="p-2.5 rounded-full bg-white/10 hover:bg-white/25 transition text-amber-100 text-xs font-bold flex items-center gap-1" title="Yönetim Paneli">
                        <i class="fa-solid fa-gear"></i>
                    </a>
                    <button id="themeToggle" class="p-2.5 rounded-full bg-white/10 hover:bg-white/20 transition text-amber-100">
                        <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="mt-4 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Lezzetli bir şeyler ara..." 
                    class="w-full pl-9 pr-4 py-2.5 bg-white dark:bg-slate-800 text-gray-800 dark:text-white rounded-xl shadow-inner text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 transition placeholder-gray-400">
            </div>
        </div>
    </header>

    <!-- Categories Tab Bar (Sticky) -->
    <nav class="sticky top-0 z-20 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-gray-200 dark:border-slate-800 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar" id="categoryContainer">
            <!-- Dinamik doldurulacak -->
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 pt-4">
        <!-- Duyuru / Kampanya Banners -->
        <div class="mb-5 bg-gradient-to-r from-amber-500 to-amber-600 rounded-2xl p-4 text-white shadow-md flex items-center justify-between">
            <div>
                <span class="text-[10px] uppercase font-bold tracking-wider bg-white/20 px-2 py-0.5 rounded">Günün Fırsatı</span>
                <h2 class="font-bold text-base mt-1">Tatlı Alana Kahve %50 İndirimli!</h2>
                <p class="text-xs text-amber-100 mt-0.5">14:00 - 18:00 saatleri arasında geçerlidir.</p>
            </div>
            <i class="fa-solid fa-mug-hot text-4xl text-amber-200/50"></i>
        </div>

        <!-- Ürün Listesi Başlığı -->
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider" id="currentCategoryTitle">Tüm Ürünler</h3>
            <span class="text-xs text-gray-400" id="itemCountText">0 Ürün</span>
        </div>

        <!-- Ürün Kartları Grid -->
        <div class="grid grid-cols-1 gap-3.5" id="productList">
            <!-- JavaScript ile doldurulacak -->
        </div>
    </main>

    <!-- Sabit Alt Butonlar (Garson Çağır / Hesap İste) -->
    <div class="fixed bottom-4 left-0 right-0 z-30 px-4">
        <div class="max-w-md mx-auto bg-slate-900/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl p-2 shadow-2xl flex items-center gap-2 border border-slate-700/50">
            <button onclick="openModal('waiter')" class="flex-1 py-2.5 px-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-lg transition active:scale-95">
                <i class="fa-solid fa-bell text-sm"></i> Garson Çağır
            </button>
            <button onclick="openModal('bill')" class="flex-1 py-2.5 px-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition active:scale-95">
                <i class="fa-solid fa-receipt text-sm"></i> Hesap İste
            </button>
        </div>
    </div>

    <!-- Garson / Hesap İste Modalı -->
    <div id="serviceModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
        <div class="bg-white dark:bg-slate-800 rounded-t-3xl sm:rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center transform transition-transform">
            <div id="modalIconContainer" class="w-16 h-16 bg-amber-100 dark:bg-amber-900/30 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-bell"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900 dark:text-white" id="modalTitle">Garson Çağır</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" id="modalDesc">Masa 04 için bildirim garson ekibine iletilecektir.</p>
            <div class="mt-6 flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-2.5 bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-gray-200 rounded-xl font-semibold text-xs">Vazgeç</button>
                <button onclick="sendServiceRequest()" class="flex-1 py-2.5 bg-amber-500 text-white rounded-xl font-semibold text-xs shadow-md">Onayla ve Gönder</button>
            </div>
        </div>
    </div>

    <!-- Ürün Detay Modalı -->
    <div id="productDetailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-800 rounded-t-3xl sm:rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl">
            <div class="relative h-48">
                <img id="detailImg" src="" alt="" class="w-full h-full object-cover">
                <button onclick="closeProductModal()" class="absolute top-3 right-3 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center backdrop-blur">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="font-bold text-lg text-gray-900 dark:text-white" id="detailTitle">Ürün Adı</h3>
                    <span class="text-amber-600 dark:text-amber-400 font-extrabold text-lg" id="detailPrice">0 ₺</span>
                </div>
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-4" id="detailDesc">Ürün açıklaması...</p>
                <div class="border-t border-gray-100 dark:border-slate-700 pt-3 flex items-center justify-between text-xs text-gray-400">
                    <span id="detailCal"><i class="fa-solid fa-fire text-amber-500 mr-1"></i> -- kcal</span>
                    <span><i class="fa-solid fa-clock mr-1"></i> 10-15 dk</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Mantığı -->
    <script>
        const categories = [
            { id: 'tum', name: 'Tümü', icon: 'fa-border-all' },
            { id: 'kahve', name: 'Sıcak Kahveler', icon: 'fa-mug-hot' },
            { id: 'soguk', name: 'Soğuk İçecekler', icon: 'fa-glass-water' },
            { id: 'tatli', name: 'Tatlılar', icon: 'fa-cake-candles' },
            { id: 'kahvalti', name: 'Atıştırmalık', icon: 'fa-utensils' }
        ];

        let products = [];
        let activeCategory = 'tum';
        let favorites = JSON.parse(localStorage.getItem('favs') || '[]');

        const categoryContainer = document.getElementById('categoryContainer');
        const productList = document.getElementById('productList');
        const searchInput = document.getElementById('searchInput');

        // Sayfa Yüklendiğinde Backend'den Ürünleri Çekiyoruz
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/products');
                products = await response.json();
            } catch (error) {
                console.error("Ürünler çekilemedi:", error);
            }
            renderCategories();
            renderProducts();
        });

        function renderCategories() {
            categoryContainer.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat.id}')" 
                    class="px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 ${
                        activeCategory === cat.id 
                        ? 'bg-amber-500 text-white shadow-sm' 
                        : 'bg-gray-100 dark:bg-slate-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200'
                    }">
                    <i class="fa-solid ${cat.icon}"></i> ${cat.name}
                </button>
            `).join('');
        }

        function setCategory(catId) {
            activeCategory = catId;
            renderCategories();
            renderProducts();
            const catObj = categories.find(c => c.id === catId);
            document.getElementById('currentCategoryTitle').innerText = catObj ? catObj.name : 'Tüm Ürünler';
        }

        function renderProducts() {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = products.filter(p => {
                const matchesCat = activeCategory === 'tum' || p.category === activeCategory;
                const matchesSearch = p.name.toLowerCase().includes(query) || (p.desc && p.desc.toLowerCase().includes(query));
                return matchesCat && matchesSearch;
            });

            document.getElementById('itemCountText').innerText = `${filtered.length} Ürün`;

            if (filtered.length === 0) {
                productList.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <i class="fa-solid fa-utensils text-3xl mb-2"></i>
                        <p class="text-xs">Aramanızla eşleşen ürün bulunamadı.</p>
                    </div>`;
                return;
            }

            productList.innerHTML = filtered.map(item => {
                const isFav = favorites.includes(item.id);
                return `
                <div class="bg-white dark:bg-slate-800/90 rounded-2xl p-3 shadow-sm border border-gray-100 dark:border-slate-800 flex gap-3 items-center relative overflow-hidden transition active:scale-[0.99]" onclick="openProductModal(${item.id})">
                    <img src="${item.img}" alt="${item.name}" class="w-24 h-24 rounded-xl object-cover flex-shrink-0">
                    <div class="flex-1 min-w-0 pr-6">
                        <h4 class="font-bold text-sm text-gray-900 dark:text-white truncate">${item.name}</h4>
                        <p class="text-[11px] text-gray-500 dark:text-gray-400 line-clamp-2 mt-0.5">${item.desc || ''}</p>
                        <div class="mt-2 flex items-center justify-between">
                            <span class="text-amber-600 dark:text-amber-400 font-extrabold text-sm">${item.price} ₺</span>
                            <span class="text-[10px] text-gray-400">${item.cal || ''}</span>
                        </div>
                    </div>
                    <button onclick="toggleFav(event, ${item.id})" class="absolute top-3 right-3 p-1.5 text-gray-300 dark:text-gray-600 hover:text-red-500 transition">
                        <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart ${isFav ? 'text-red-500' : ''}"></i>
                    </button>
                </div>
            `}).join('');
        }

        searchInput.addEventListener('input', renderProducts);

        function toggleFav(e, id) {
            e.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('favs', JSON.stringify(favorites));
            renderProducts();
        }

        function openModal(type) {
            const modal = document.getElementById('serviceModal');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const icon = document.getElementById('modalIconContainer');

            if (type === 'waiter') {
                title.innerText = "Garson Çağır";
                desc.innerText = "Masaya bakması için garson arkadaşımıza bildirim gönderilecektir.";
                icon.innerHTML = `<i class="fa-solid fa-bell"></i>`;
            } else {
                title.innerText = "Hesap İste";
                desc.innerText = "Nakit veya Kredi Kartı seçeneğiniz masada alınacaktır.";
                icon.innerHTML = `<i class="fa-solid fa-receipt"></i>`;
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('serviceModal').classList.add('hidden');
        }

        function sendServiceRequest() {
            closeModal();
            alert("Talebiniz başarıyla garson paneline iletildi!");
        }

        function openProductModal(id) {
            const item = products.find(p => p.id === id);
            if(!item) return;

            document.getElementById('detailImg').src = item.img;
            document.getElementById('detailTitle').innerText = item.name;
            document.getElementById('detailPrice').innerText = item.price + ' ₺';
            document.getElementById('detailDesc').innerText = item.desc || '';
            document.getElementById('detailCal').innerHTML = `<i class="fa-solid fa-fire text-amber-500 mr-1"></i> ${item.cal || '-- kcal'}`;

            document.getElementById('productDetailModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productDetailModal').classList.add('hidden');
        }

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if(document.documentElement.classList.contains('dark')) {
                themeIcon.className = "fa-solid fa-sun text-lg";
            } else {
                themeIcon.className = "fa-solid fa-moon text-lg";
            }
        });
    </script>
</body>
</html>
